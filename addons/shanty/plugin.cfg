name="Shanty"
description="Dialogue and short cutscenes authored as typed data: a pure runner, a scene selector, a CanvasLayer player, and a Shanty tab where writers edit speakers, conversations, scenes and triggers, preview each line and play a scene. The runtime classes register through class_name and need no plugin."
