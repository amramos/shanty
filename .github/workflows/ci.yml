name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.1-stable"
  GODOT_ZIP: "Godot_v4.7.1-stable_linux.x86_64.zip"
  GODOT_BINARY: "Godot_v4.7.1-stable_linux.x86_64"
  GDTOOLKIT_VERSION: "4.5.0"

jobs:
  lint:
    name: Format, lint and manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"

      # GUT is third-party and keeps its own style; everything else is ours.
      - name: gdformat --check
        run: git ls-files -z '*.gd' ':(exclude)addons/gut/*' | xargs -0 gdformat --check

      - name: gdlint
        run: git ls-files -z '*.gd' ':(exclude)addons/gut/*' | xargs -0 gdlint

      - name: Manifest
        run: python tools/manifest.py --check

  test:
    name: GUT on Godot 4.7.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (headless)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o "${GODOT_ZIP}" "${base}/${GODOT_ZIP}"
          curl -fsSL -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          grep "  ${GODOT_ZIP}\$" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip -q "${GODOT_ZIP}" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/${GODOT_BINARY}"
          echo "GODOT=${RUNNER_TEMP}/godot/${GODOT_BINARY}" >> "${GITHUB_ENV}"
          rm "${GODOT_ZIP}" SHA512-SUMS.txt

      - name: Import
        run: |
          "${GODOT}" --version
          "${GODOT}" --headless --import

      - name: GUT
        run: '"${GODOT}" --headless -s addons/gut/gut_cmdln.gd -gexit -gconfig=.gutconfig.json'

  release-tag:
    name: Tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag, plugin.cfg and changelog agree
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/shanty/plugin.cfg)"
          echo "tag ${GITHUB_REF_NAME}, plugin.cfg ${plugin_version}"
          if [ "${tag_version}" != "${plugin_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin.cfg version ${plugin_version}"
            exit 1
          fi
          escaped="$(printf '%s' "${tag_version}" | sed 's/\./\\./g')"
          if ! grep -Eq "^## \[?${escaped}\]?( |\$)" addons/shanty/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${tag_version}"
            exit 1
          fi
